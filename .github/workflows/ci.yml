name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API
    runs-on: ubuntu-latest
    # A hung suite should fail in minutes, not burn an hour of somebody's quota.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: touchline
          POSTGRES_DB: touchline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, intl, openssl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The test database is built by running the real migrations, so a migration that no
      # longer applies fails the pull request rather than a deployment.
      - name: Run migrations
        env:
          DB_PASSWORD: touchline
          DB_DATABASE: touchline_test
        run: php artisan migrate --force

      - run: composer cs
      - run: composer stan

      # --profile prints the ten slowest tests. A suite that quietly gets slower is a
      # suite people stop running, and the number is only visible if something prints it.
      - name: Run the test suite
        env:
          DB_PASSWORD: touchline
        run: vendor/bin/pest --profile

  frontend:
    name: SPA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # One LTS behind the runtime, so an accidental dependency on a newer Node is caught
      # here rather than in a container that will not boot.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: touchline
          POSTGRES_DB: touchline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Render builds this exact file, so "does the deployable image even build" belongs in
      # the pull request rather than in a deploy that fails ten minutes after merging.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: touchline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not booting. An image that compiles fine and then dies on its first
      # request is the failure worth catching, so this actually starts it and asks it things.
      #
      # --cap-drop=ALL is stricter than the hosting needs, and deliberately: it is what
      # catches a binary that will not exec because of file capabilities.
      # Building is not booting. An image that compiles fine and then dies on its first
      # request is the failure worth catching, so this actually starts it and asks it things.
      #
      # --cap-drop=ALL is stricter than the hosting needs, and deliberately: it is what
      # catches a binary that will not exec because of file capabilities.
      #
      # 127.0.0.1 rather than localhost throughout, because localhost can resolve to ::1
      # first and then a server listening only on IPv4 looks like a server that is not there.
      - name: Boot it and ask it for something
        run: |
          docker run -d --name touchline             --cap-drop=ALL             --network host             -e PORT=8080             -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"             -e APP_URL=http://127.0.0.1:8080             -e DB_CONNECTION=pgsql             -e DB_URL="postgresql://postgres:touchline@127.0.0.1:5432/touchline"             -e SESSION_DRIVER=database             -e CACHE_STORE=database             -e QUEUE_CONNECTION=database             -e RUN_RELEASE_ON_START=true             -e DEMO_LOGIN_ENABLED=true             touchline:ci

          echo "Waiting for the health check"
          for i in $(seq 1 60); do
            code=$(curl -sS -o /tmp/health -w '%{http_code}' http://127.0.0.1:8080/up || echo 000)

            if [ "$code" = "200" ]; then
              echo "up after ${i}s"
              break
            fi

            if [ "$i" = "60" ]; then
              echo "never came up; last status was ${code}"
              echo "--- what the container said ---"
              docker logs touchline
              echo "--- what Laravel wrote down ---"
              docker exec touchline sh -c 'cat storage/logs/*.log 2>/dev/null | tail -80' || true
              exit 1
            fi

            sleep 1
          done

          echo "Checking the SPA is served, not just the API"
          curl -fsS http://127.0.0.1:8080/sign-in > /tmp/signin             || { echo "the sign-in page did not come back"; docker logs touchline; exit 1; }
          grep -q 'id="app"' /tmp/signin             || { echo "no mount point on the sign-in page"; head -c 2000 /tmp/signin; exit 1; }

          echo "Checking the assets the SPA asks for are actually there"
          asset=$(grep -oE '/build/assets/app-[^"]+\.js' /tmp/signin | head -1)
          test -n "$asset" || { echo "no hashed asset referenced"; head -c 2000 /tmp/signin; exit 1; }
          curl -fsS "http://127.0.0.1:8080${asset}" > /dev/null             || { echo "the asset it asked for is not being served"; exit 1; }

          echo "Checking migrations actually ran"
          docker exec touchline php artisan migrate:status | grep -q "Ran"             || { echo "migrations did not run"; docker logs touchline; exit 1; }

      - name: Show the logs if any of that failed
        if: failure()
        run: docker logs touchline

      - name: Stop it
        if: always()
        run: docker rm -f touchline || true
