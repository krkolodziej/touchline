# Read only when the service is created as a Blueprint. A plain web service built from the
# same repository ignores this file entirely and silently, which is worth checking for after
# the first deploy — see the README.
services:
  - type: web
    name: touchline
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up

    # Deploy only once the checks are green. CI builds this same Dockerfile and boots the
    # container, so an image that will not start fails in the pull request and can never
    # reach production.
    autoDeployTrigger: checksPass

    envVars:
      - key: APP_NAME
        value: Touchline
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false

      # Typed in rather than generated. `generateValue` produces a random string of the
      # platform's own length, and Laravel's AES-256-CBC cipher wants exactly thirty-two
      # bytes, base64-encoded and prefixed — anything else boots fine and then answers five
      # hundred to every request with "unsupported cipher or incorrect key length".
      #
      #     php artisan key:generate --show
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false

      # The Neon connection string, under the name Laravel actually reads. Postgres from
      # Neon rather than a free Render database, because a free Render database is deleted
      # after thirty days and a free Neon project is not.
      #
      # The *direct* endpoint, not the pooled one. Neon's pooler is PgBouncer in transaction
      # mode, and the first migration on an empty database dies there: every statement comes
      # back "current transaction is aborted", including the very first one the migration
      # sends, which means the connection it was handed was already inside a failed
      # transaction. One small instance opens a handful of connections, so the pooler was
      # buying nothing to begin with.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: CACHE_STORE
        value: database

      # The queue is a table in the same database, so a job dispatched inside a transaction
      # is committed or rolled back with it.
      - key: QUEUE_CONNECTION
        value: database

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      - key: RUN_RELEASE_ON_START
        value: true
      - key: RUN_WORKER
        value: true
      - key: RUN_SCHEDULER
        value: true

      # A way in without an account, and the data for it.
      - key: DEMO_LOGIN_ENABLED
        value: true
      - key: SEED_DEMO_ON_START
        value: true
